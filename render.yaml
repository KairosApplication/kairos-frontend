services:
  - type: web
    name: kairos-frontend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_UPSTREAM_URL
        value: https://d3bmuckfmecew.cloudfront.net
      - key: CHATBOT_UPSTREAM_URL
        sync: false
